name: Update IPC Data
on:
  schedule:
    - cron: '0 8,12 * * 1-5'  # Días laborables, 8:00 y 12:00 UTC
  workflow_dispatch: {}     # Permitir ejecución manual
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run download-data
      - run: npm run download-rubricas-data
      - id: data-diff
        run: |
          if git diff --quiet src/data/ipc-data.json src/data/ipc-rubricas.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.data-diff.outputs.changed == 'true'
        run: npm run build
      - if: steps.data-diff.outputs.changed == 'true'
        run: npm test
      - if: steps.data-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ipc-data.json src/data/ipc-rubricas.json
          HUSKY=0 git commit -m "chore: update IPC datasets from INE"
          git push
      - if: steps.data-diff.outputs.changed == 'true'
        uses: actions/configure-pages@v6
      - if: steps.data-diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - if: steps.data-diff.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
