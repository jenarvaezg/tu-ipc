name: Update IPC Data
on:
  schedule:
    - cron: '0 8,12 * * 1-5'  # Días laborables, 8:00 y 12:00 UTC
  workflow_dispatch: {}     # Permitir ejecución manual
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run download-data
      - run: npm run download-rubricas-data
      - run: |
          git diff --quiet src/data/ipc-data.json src/data/ipc-rubricas.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ipc-data.json src/data/ipc-rubricas.json
          git commit -m "chore: update IPC datasets from INE"
          git push
