          "mainEntity": [
            {
              "@type": "Question",
              "name": "¿Cómo calculo mi IPC personal?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ajusta los pesos de las 12 categorías de gasto (alimentación, vivienda, transporte, etc.) para que reflejen tu consumo real. La calculadora aplica esos pesos a los índices oficiales del INE y obtiene tu IPC personal, que puede diferir del IPC oficial."
              }
            },
            {
              "@type": "Question",
              "name": "¿Qué diferencia hay entre mi IPC y el IPC oficial?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "El IPC oficial usa pesos medios de todos los hogares españoles. Tu IPC personal refleja tus hábitos reales de consumo: si gastas más en alimentación y menos en ocio, tu inflación puede ser mayor o menor que la media."
              }
            },
            {
              "@type": "Question",
              "name": "¿De dónde salen los datos de mi IPC?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Todos los datos provienen del Instituto Nacional de Estadística (INE). Se actualizan mensualmente con los índices ECOICOP por comunidad autónoma, base 2021=100."
              }
            }
          ]
        }
