<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tu IPC Personal</title>
    <script>
      // GitHub Pages SPA redirect: store the path and redirect to base
      // so the React app can pick it up and render the right page.
      var path = window.location.pathname || '/';
      var segments = path.split('/').filter(Boolean);
      var knownRoutes = ['metodologia', 'privacidad'];
      var base = '/';

      // Supports both custom domain root (/) and project pages (/repo/).
      if (segments.length > 1 && knownRoutes.indexOf(segments[0]) === -1) {
        base = '/' + segments[0] + '/';
      }

      var subPath = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, '');
      sessionStorage.setItem('spa-redirect', subPath + window.location.search + window.location.hash);
      window.location.replace(base);
    </script>
  </head>
  <body></body>
</html>
